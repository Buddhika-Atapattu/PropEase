    <!-- Tenant Section -->
    <div class="row mb-4">
      <div class="col-xl-12">
        <h1 class="title">Tenant</h1>
      </div>
    </div>

    @if(leaseTableData.length > 0){
    <app-custom-table
      [(isReload)]="leaseTableIsReloading"
      [pagination]="true"
      [pageSize]="leaseTablePageSize"
      [(pageSizeOptions)]="leaseTablePageSizeOptions"
      [(index)]="leaseTablePageIndex"
      [tableTitle]="leaseTableTitle"
      [(search)]="leaseTabletSearch"
      [buttons]="leaseActionButtons"
      [fileExportExtention]="leaseFileExtension"
      (fileExport)="handleExportLeaseTableData($event)"
      (buttonOperation)="handleLeaseOperations($event)"
      [data]="leaseTableData"
      [columns]="leaseTableColumns"
      [totalDataCount]="leaseLength"
    ></app-custom-table>
    } } @else {
    <div class="row mb-4">
      <div class="col-xl-12">
        <h1 class="title">Admin Operation</h1>
      </div>
    </div>

    <div class="row">

        <hr class="my-5" />

      </div>
