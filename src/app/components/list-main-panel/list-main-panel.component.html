<div class="side-panel" [class.side-panel-collapsed]="collapsed">
  <!-- Expand / collapse button -->
  <button
    type="button"
    mat-icon-button
    class="expand-btn"
    [class.expand-collapse-btn]="collapsed"
    (click)="togglePanel()"
  >
    <mat-icon>
      {{ collapsed ? "chevron_right" : "chevron_left" }}
    </mat-icon>
  </button>

  <!-- Menu items -->
  <ul class="menu">
    @for (link of menuLists; track link; let i = $index) {

    <!-- ───────── Parent with children (fly-out overlay) ───────── -->
    @if (link.sub) {
    <li
      class="menu-item m-0 has-children"
      [class.active]="
        (currecntURL === link.url && link.url !== '') ||
        activeParentRoute === link.url
      "
    >
      <button
        type="button"
        class="menu-btn"
        [class.btn-collapse]="collapsed"
        cdkOverlayOrigin
        #origin="cdkOverlayOrigin"
        (click)="onParentClick(link, origin, i)"
      >
        <mat-icon
          [svgIcon]="link.mat_icon"
          [matTooltip]="collapsed ? link.toolTip : ''"
          matTooltipPosition="right"
        ></mat-icon>

        <span class="label delay-expand">
          {{ link.icon_text }}
        </span>

        <span
          class="dropdown-icon delay-expand"
          [class.rotate]="submenuOpen && activeSubmenuIndex === i"
        >
          <i class="fa-solid fa-chevron-down"></i>
        </span>
      </button>
    </li>
    }

    <!-- ───────── Single-level parent (no children) ───────── -->
    @else {
    <li
      class="menu-item m-0"
      [class.active]="currecntURL === link.url && link.url !== ''"
    >
      <button
        type="button"
        class="menu-btn"
        (click)="navigateTo(link.url, null, null)"
        [class.btn-collapse]="collapsed"
      >
        <mat-icon
          [svgIcon]="link.mat_icon"
          [matTooltip]="collapsed ? link.toolTip : ''"
          matTooltipPosition="right"
        ></mat-icon>

        <span class="label delay-expand">
          {{ link.icon_text }}
        </span>
      </button>
    </li>
    } }
  </ul>

  <!-- ───────── Fly-out submenu overlay content ───────── -->
  <ng-template
    cdkConnectedOverlay
    #submenuOverlay="cdkConnectedOverlay"
    [cdkConnectedOverlayOrigin]="submenuOrigin"
    [cdkConnectedOverlayOpen]="submenuOpen"
    [cdkConnectedOverlayPositions]="overlayPositions"
    [cdkConnectedOverlayHasBackdrop]="true"
    [cdkConnectedOverlayBackdropClass]="'transparent-backdrop'"
    cdkConnectedOverlayPanelClass="submenu-flyout"
    (backdropClick)="closeSubmenu()"
    (detach)="closeSubmenu()"
  >
    <ul class="submenu-list">
      @for (item of submenuItems; track item) {
      <li class="submenu-item">
        <button
          type="button"
          class="menu-btn sub-btn"
          [class.btn-collapse]="collapsed"
          (click)="navigateTo(activeParentPath, item.url, null); closeSubmenu()"
        >
          <mat-icon
            [svgIcon]="item.mat_icon"
            matTooltipPosition="right"
            [matTooltip]="collapsed ? item.toolTip : ''"
          ></mat-icon>

          <span class="label">
            {{ item.icon_text }}
          </span>
        </button>
      </li>
      }
    </ul>
  </ng-template>
</div>
