<app-notification></app-notification>
<label class="toggle-switch">
  <input
    type="checkbox"
    [checked]="localCheck"
    (change)="onToggle()"
    name="switch"
    #checkBox
  />
  <span class="slider">
    <span class="label-text on">{{ labelOn }}</span>
    <span class="label-text off">{{ labelOff }}</span>
  </span>
</label>
