@if(show) {

<div class="preloader-backdrop" #preloaderBackdrop>
  <div class="preloader-shell">
    <!-- Logo -->
    <div class="preloader-logo-wrap">
      <img
        src="Images/company-images/logo/logo/animation.gif"
        alt="PropEase Logo"
        class="preloader-logo"
      />
      <div class="preloader-logo-glow"></div>
    </div>

    <!-- Text -->
    <h2 class="preloader-title">Welcome to PropEase</h2>
    <p class="preloader-subtitle">Preparing your property workspace…</p>

    <!-- Module timeline -->
    <div class="preloader-timeline">
      <div class="timeline-track">
        <div
          class="timeline-fill"
          [class.timeline-fill--error]="isError"
          [class.timeline-fill--complete]="progressValue === 100"
          [style.transform]="'scaleX(' + progressValue / 100 + ')'"
        ></div>
      </div>

      <ul class="timeline-steps">
        <li class="step step-1">Properties</li>
        <li class="step step-2">Tenants</li>
        <li class="step step-3">Payments</li>
        <li class="step step-4">Complaints</li>
        <li class="step step-5">Dashboard</li>
      </ul>
    </div>

    <!-- Animated status text -->
    <p
      class="preloader-status"
      [class.preloader-status--error]="isError"
      [class.preloader-status--complete]="progressValue === 100"
    >
      <span
        class="status-dot"
        [class.status-dot--error]="isError"
        [class.status-dot--complete]="progressValue === 100"
      ></span>

      <span class="status-text">
        @if (isError) { Error loading workspace… } @else if (progressValue ===
        100) { All modules loaded. Workspace ready. } @else { Loading modules… }
      </span>
    </p>
  </div>
</div>

}
