<!-- =========================================================
Dialog Header
========================================================= -->

<div class="dialog-header">
  <h2 class="dialog-title">{{ data.title }}</h2>
</div>

<!-- =========================================================
Dialog Content
========================================================= -->

<div class="dialog-content">
  <mat-form-field appearance="fill" class="pe-dialog-text-field">
    <mat-label>{{ data.label }}</mat-label>

    <textarea
      matInput
      [(ngModel)]="value"
      rows="7"
      [attr.maxLength]="data.maxLength ?? null"
    ></textarea>

    <mat-hint align="end" class="char-counter" *ngIf="data.maxLength">
      {{ value.length || 0 }}/{{ data.maxLength }}
    </mat-hint>
  </mat-form-field>
</div>

<!-- =========================================================
Actions
========================================================= -->

<div class="dialog-actions">
  <button mat-button type="button" class="btn-cancel" (click)="onCancel()">
    Cancel
  </button>

  <button
    mat-flat-button
    color="primary"
    class="btn-save"
    type="button"
    (click)="onSave()"
  >
    Save
  </button>
</div>
