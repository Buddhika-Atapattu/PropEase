<!-- Path: src/components/user-info-panel/user-info-panel.component.html -->
<div
  class="user-info-panel"
  [class.dark]="mode === true"
  [class.light]="mode === false"
  role="dialog"
  aria-modal="true"
  aria-labelledby="uip-title"
  tabindex="-1"
>
  <!-- Header -->
  <header class="uip-header">
    <div class="uip-avatar">
      <img
        *ngIf="user?.image as img; else initials"
        [src]="(typeof img === 'string') ? img : ''"
        [alt]="user?.name || 'User avatar'"
        referrerpolicy="no-referrer"
      />
      <ng-template #initials>
        <span>{{ (user?.name || "U").slice(0, 1) }}</span>
      </ng-template>
    </div>

    <div class="uip-meta">
      <h3 id="uip-title" class="uip-name" title="{{ user?.name || '' }}">
        {{ user?.name || "User" }}
      </h3>
      <div class="uip-sub">
        <span
          class="uip-role"
          [attr.aria-label]="'Role: ' + (user?.role || 'user')"
        >
          {{ user?.role || "user" | titlecase }}
        </span>
        <span class="uip-dot" aria-hidden="true">•</span>
        <span class="uip-email" title="{{ user?.email || '' }}">{{
          user?.email || "—"
        }}</span>
      </div>
    </div>

    <button
      type="button"
      class="uip-close"
      aria-label="Close profile panel"
      (click)="close(false)"
    >
      ×
    </button>
  </header>

  <!-- Body: quick stats (optional placeholders) -->
  <section class="uip-stats" aria-label="Account quick stats">
    <div class="uip-stat">
      <span class="uip-stat-label">Status</span>
      <span class="uip-stat-value" [class.active]="user?.isActive">
        {{ user?.isActive ? "Active" : "Inactive" }}
      </span>
    </div>
    <div class="uip-stat">
      <span class="uip-stat-label">Access</span>
      <span class="uip-stat-value">
        {{ user?.role || "user" | titlecase }}
      </span>
    </div>
    <div class="uip-stat">
      <span class="uip-stat-label">Notifications</span>
      <span class="uip-stat-value">
        {{ authService.unreadNotificationsCount }} unread
      </span>
    </div>
  </section>

  <!-- Actions -->
  <nav class="uip-actions" aria-label="Quick actions">
    <button type="button" class="uip-btn primary" (click)="open()">
      View profile
    </button>

    <button
      type="button"
      class="uip-btn"
      (click)="close(false); router.navigate(['/dashboard/all-notifications'])"
    >
      Notifications
    </button>

    <button
      type="button"
      class="uip-btn"
      (click)="close(false); router.navigate(['/dashboard/users'])"
      *ngIf="
        user?.role === 'admin' ||
        user?.role === 'operator' ||
        user?.role === 'manager'
      "
    >
      User management
    </button>

    <button type="button" class="uip-btn warn" (click)="logout()">
      Sign out
    </button>
  </nav>
</div>
