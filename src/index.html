<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
      Content Security Policy:
      - No 'unsafe-eval' (Electron-safe)
      - Allow inline styles/scripts as you have inline preloader + base switcher
      - Whitelist only the CDNs you really use
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
                default-src 'self' data: blob: file:;
                base-uri 'self';
                form-action 'self';

                img-src 'self' data: blob: https: http: file:;
                media-src 'self' data: blob: https: http: file:;
                style-src 'self' 'unsafe-inline' https: https://cdn.tiny.cloud;
                font-src  'self' data: https: https://cdn.tiny.cloud;

                script-src 'self' 'unsafe-inline' 'unsafe-eval'
                http://localhost:4200
                https://www.gstatic.com https://ssl.gstatic.com
                https://www.google.com https://apis.google.com
                https://cdn.jsdelivr.net https://kit.fontawesome.com
                https://maps.googleapis.com https://cdn.tiny.cloud;

                connect-src 'self' data: blob: http: https: ws: wss:
                https://www.gstatic.com https://ssl.gstatic.com
                https://www.google.com https://apis.google.com
                https://maps.googleapis.com https://maps.gstatic.com https://cdn.tiny.cloud;

                frame-src 'self' data: about: https://www.gstatic.com https://ssl.gstatic.com https://www.google.com https://apis.google.com;

                worker-src 'self' blob:;
                object-src 'none';
              "
    />

    <meta charset="utf-8" />
    <title>PropEase</title>

    <!-- Dynamic base: '/' on web servers, './' for file:// (Electron) -->
    <script>
      (function setBaseHref() {
        var base = document.createElement("base");
        base.href = location.protocol === "file:" ? "./" : "/";
        document.head.appendChild(base);
      })();
    </script>

    <!-- Security headers -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="color-scheme" content="light dark" />
    <meta name="author" content="Buddhika Atapattu" />
    <meta
      name="description"
      content="This system is built for property management"
    />

    <!-- All assets are copied from public/ to the build root: use relative paths (no leading /) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0..200"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="Images/company-images/LogoIcon.ico"
    />
    <link rel="apple-touch-icon" href="Images/company-images/logo128.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Google Fonts (CSS) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Material Icons (CSS) -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS (CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <style>
      :root {
        --bg-color: #fdf6e3;
        --second-bg-color: #9c9171;
        --text-color: #08122f;
        --logo-glow: rgba(255, 215, 0, 0.8);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #08122f;
          --second-bg-color: #000000;
          --text-color: #fdf6e3;
          --logo-glow: rgba(255, 215, 0, 0.8);
        }
      }
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background: linear-gradient(
          135deg,
          var(--bg-color) 0%,
          var(--second-bg-color) 100%
        );
        transition: background 0.5s ease-in-out;
      }
      #preloader-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
      }
      .logo-wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 2;
        color: var(--text-color);
        font-family: "Roboto", sans-serif;
        animation: fadeIn 1s ease-in-out forwards;
      }
      .preloader-logo {
        width: 200px;
        height: auto;
        border-radius: 5rem;
        box-shadow: 0 0 25px var(--logo-glow);
        animation: float 4s ease-in-out infinite,
          pulse 2.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      @keyframes float {
        0%,
        100% {
          transform: translate(-50%, -48%);
        }
        50% {
          transform: translate(-50%, -52%);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0.3;
        }
        to {
          opacity: 1;
        }
      }
      gmpx-place-autocomplete {
        display: block;
        width: 100%;
        max-width: 500px;
      }
    </style>

    <!-- Google Maps JS API (keep your key) -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDtyUEKZAgXCBiuteyZVvaAaV0OVm-Wydc&libraries=places&v=weekly&loading=async"
      async
    ></script>
  </head>

  <body class="mat-typography overflow-hidden">
    <app-root></app-root>

    <!-- Preloader -->
    <div id="app-preloader">
      <canvas id="preloader-container"></canvas>
      <div class="logo-wrapper">
        <img
          src="Images/company-images/company-logo-animated.gif"
          alt="Company Logo"
          class="preloader-logo"
        />
      </div>
    </div>

    <noscript
      >Please enable JavaScript to continue using this application.</noscript
    >

    <!-- Google Charts loader (CDN) -->
    <script
      type="text/javascript"
      src="https://www.gstatic.com/charts/loader.js"
    ></script>

    <!-- Preloader particles + auto-hide when page fully loaded -->
    <script>
      (function () {
        document.addEventListener("DOMContentLoaded", function () {
          var canvas = document.getElementById("preloader-container");
          if (!canvas) return;
          var ctx = canvas.getContext("2d");
          function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
          }
          resize();
          window.addEventListener("resize", resize);

          var particles = [];
          var numParticles = 100;

          function Particle() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.radius = Math.random() * 1.8 + 0.5;
            this.color = "rgba(255, 215, 0, 0.8)";
            this.speedX = (Math.random() - 0.5) * 0.6;
            this.speedY = (Math.random() - 0.5) * 0.6;
          }
          Particle.prototype.update = function () {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
            if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
          };
          Particle.prototype.draw = function () {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowColor = "gold";
            ctx.shadowBlur = 10;
            ctx.fill();
          };

          for (var i = 0; i < numParticles; i++) particles.push(new Particle());

          function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(function (p) {
              p.update();
              p.draw();
            });
            requestAnimationFrame(animate);
          }
          animate();
        });

        // Hide preloader once everything (including Angular bundles) is loaded
        window.addEventListener("load", function () {
          var pre = document.getElementById("app-preloader");
          if (pre) pre.style.display = "none";
        });
      })();
    </script>

    <!-- FontAwesome Kit -->
    <script
      src="https://kit.fontawesome.com/caf2306f51.js"
      crossorigin="anonymous"
    ></script>
    <!-- Popper + Bootstrap JS (CDN) -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
      integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
      integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
