<h2 mat-dialog-title>{{ data.title }}</h2>

<div mat-dialog-content>
  <mat-form-field appearance="outline" class="w-100 pe-dialog-text-field">
    <mat-label>{{ data.label }}</mat-label>
    <textarea
      matInput
      [(ngModel)]="value"
      [attr.maxLength]="data.maxLength ?? null"
      rows="8"
    ></textarea>
    <mat-hint align="end" *ngIf="data.maxLength">
      {{ value.length || 0 }}/{{ data.maxLength }}
    </mat-hint>
  </mat-form-field>
</div>

<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" type="button" (click)="onSave()">
    Save
  </button>
</div>
